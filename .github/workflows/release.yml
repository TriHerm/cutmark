name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure ffmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Test
        env:
          CUTMARK_CI_SERIAL_SWIFT: '1'
        run: ./test.sh --quiet
      - name: Build Cutmark.app
        env:
          CUTMARK_RELEASE: ${{ github.ref_name }}
          CUTMARK_ADHOC_SIGN: '1'
          SKIP_TESTS: '1'
        run: ./build.sh
      - name: Package Cutmark.dmg
        run: ./scripts/package-dmg.sh
      - name: Verify release artifact
        run: |
          test -f build.noindex/Cutmark.dmg
          shasum -a 256 build.noindex/Cutmark.dmg
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release create "${GITHUB_REF_NAME}" \
            build.noindex/Cutmark.dmg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cutmark ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes"
