name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --workflow CI \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::Release requires a successful CI run on $GITHUB_SHA. Wait for CI on main to pass, then re-run this workflow."
            exit 1
          fi
          echo "Reusing successful CI run $run_id for $GITHUB_SHA."

  release:
    needs: verify-ci
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build Cutmark.app
        env:
          CUTMARK_RELEASE: ${{ github.ref_name }}
          CUTMARK_ADHOC_SIGN: '1'
          CUTMARK_REQUIRE_EMBED: '1'
          SKIP_TESTS: '1'
        run: ./build.sh
      - name: Verify semantic search helper
        run: test -x build.noindex/Cutmark.app/Contents/MacOS/cutmark-embed
      - name: Package Cutmark.dmg
        run: ./scripts/package-dmg.sh
      - name: Verify release artifact
        run: |
          test -f build.noindex/Cutmark.dmg
          shasum -a 256 build.noindex/Cutmark.dmg
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release create "${GITHUB_REF_NAME}" \
            build.noindex/Cutmark.dmg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cutmark ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes"
