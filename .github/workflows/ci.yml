name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Ensure ffmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Restore MCP test timings
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/cutmark-mcp-test-times.json
          key: cutmark-mcp-times-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cutmark-mcp-times-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Test
        env:
          CUTMARK_MCP_JOBS: '4'
          CUTMARK_MCP_FAIL_FAST: '1'
          CUTMARK_CI_SERIAL_SWIFT: '1'
        run: ./test.sh --quiet

  build:
    needs: test
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate release scripts
        run: bash -n build.sh scripts/package-dmg.sh scripts/notarize-dmg.sh scripts/setup-release-keychain.sh
      - name: Build Cutmark.app
        env:
          CUTMARK_ADHOC_SIGN: '1'
          CUTMARK_VERIFY_NATIVE_SET: '1'
          SKIP_TESTS: '1'
        run: ./build.sh
