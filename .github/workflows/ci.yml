name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      # Fail fast on Swift/UI and Swift Testing macro compilation errors before the slower MCP suite.
      # ./test.sh reuses SwiftPM's build products for the full test run below.
      - name: Preflight Swift test compilation
        run: swift build --build-tests --jobs 4
      - name: Ensure ffmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Restore MCP test timings
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/cutmark-mcp-test-times.json
          key: cutmark-mcp-times-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            cutmark-mcp-times-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Test
        env:
          CUTMARK_MCP_JOBS: '4'
          CUTMARK_MCP_FAIL_FAST: '1'
          CUTMARK_CI_SERIAL_SWIFT: '1'
        run: ./test.sh --quiet

  build:
    needs: test
    runs-on: xcode-27
    # Cold Swift release compilation + the optional Metal search helper exceeded the old
    # 10-minute cap without a compiler error (PR #19). Keep a bounded job with enough headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate release scripts
        run: bash -n build.sh scripts/package-dmg.sh scripts/notarize-dmg.sh scripts/setup-release-keychain.sh
      - name: Build Cutmark.app
        env:
          CUTMARK_ADHOC_SIGN: '1'
          CUTMARK_VERIFY_NATIVE_SET: '1'
          SKIP_TESTS: '1'
        run: ./build.sh
      # PR #15 needs a testable app without installing it or publishing a release.
      # A ZIP preserves app permissions/signatures across GitHub artifact download.
      - name: Package PR #15 smoke candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 15
        shell: bash
        run: |
          set -euo pipefail
          app="build.noindex/Cutmark.app"
          out="$RUNNER_TEMP/cutmark-smoke-candidate"
          mkdir -p "$out"
          codesign --verify --deep --strict "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc'
          stamp="$(/usr/libexec/PlistBuddy -c 'Print :BuildStamp' "$app/Contents/Info.plist")"
          [[ "$stamp" == "$(git rev-parse --short HEAD) "* ]] || {
            echo "::error::Candidate BuildStamp does not match checkout HEAD"
            exit 1
          }
          zip="$out/Cutmark-${GITHUB_SHA:0:12}-adhoc.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          verify="$RUNNER_TEMP/cutmark-smoke-verify"
          mkdir -p "$verify"
          ditto -x -k "$zip" "$verify"
          codesign --verify --deep --strict "$verify/Cutmark.app"
          (
            cd "$out"
            shasum -a 256 "$(basename "$zip")" > SHA256SUMS
          )
          printf 'PR: 15\nPR head: %s\nCheckout (PR merge): %s\nBase: %s\nBuildStamp: %s\nSigning: ad-hoc (not notarized)\nPurpose: isolated smoke testing only; not a release\n' \
            '${{ github.event.pull_request.head.sha }}' "$GITHUB_SHA" \
            '${{ github.event.pull_request.base.sha }}' "$stamp" > "$out/PROVENANCE.txt"
          echo "Built PR smoke candidate for $GITHUB_SHA ($stamp)"
      - name: Upload PR #15 smoke candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 15
        uses: actions/upload-artifact@v4
        with:
          name: cutmark-pr15-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cutmark-smoke-candidate/
          if-no-files-found: error
          retention-days: 3
