name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffmpeg
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Test
        env:
          CUTMARK_CI_SERIAL_SWIFT: '1'
        run: ./test.sh --quiet
      - name: Build Cutmark.app
        env:
          CUTMARK_ADHOC_SIGN: '1'
          SKIP_TESTS: '1'
        run: ./build.sh
